<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chekd Cars Admin</title>
    <link rel="icon" type="image/png" href="icon_red.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-charts.css" />
    <style>
      /* Brand: Chekd Cars dark console. Tokens remapped once, used everywhere below. */
      :root, :root[data-theme] {
        color-scheme: dark;
        --x-bg: #0D1117; --x-panel: #161B22; --x-panel-2: #1C222B; --x-line: #262D37;
        --x-text: #F4F1EA; --x-muted: #8A93A3; --x-red: #E8412C; --x-teal: #12B5A6;
        --x-head: "Sora", var(--sans); --x-r: 14px;
        --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --text-primary: var(--x-text); --text-secondary: var(--x-muted);
        --fill-primary-on: var(--x-bg); --fill-tertiary: var(--x-panel);
        --fill-primary: var(--x-text); --text-primary-on: var(--x-bg);
        --stroke-primary: var(--x-line); --stroke-secondary: #1F252E;
        --chart-ink: var(--x-red); --chart-ink-2: var(--x-muted); --chart-ink-3: #8A93A355;
        --chart-grid: #F4F1EA12; --chart-reference: #F4F1EA24;
      }
      body { background: var(--x-bg); color: var(--x-text); font: 500 14px/1.45 var(--sans); }
      h1, h2, h3 { font-family: var(--x-head); font-weight: 600; letter-spacing: -0.01em; }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--x-red); }
      [hidden] { display: none !important; }

      /* Login */
      .x-login { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 50; background: var(--x-bg); }
      .x-login__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.35) saturate(0.8); }
      .x-login::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, #0D1117cc, #0D111766 60%, #E8412C22); }
      .x-login__card { position: relative; z-index: 1; width: min(400px, 100%); padding: 32px 28px; background: #161B22e6; border: 1px solid var(--x-line); border-radius: var(--x-r); backdrop-filter: var(--hark-blur); display: grid; gap: 14px; }
      .x-login__card img { height: 34px; width: auto; margin-bottom: 4px; }
      .x-login__card h1 { font-size: 22px; }
      .x-login__card > p { color: var(--x-muted); margin-top: -8px; }
      .x-field { display: grid; gap: 6px; font-size: 12px; color: var(--x-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .x-input { height: 44px; padding: 0 12px; background: var(--x-bg); border: 1px solid var(--x-line); border-radius: 10px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; color: var(--x-text); width: 100%; }
      .x-input:focus { border-color: var(--x-red); outline: none; }
      .x-btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--x-line); background: var(--x-panel-2); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
      .x-btn:hover { border-color: var(--x-muted); }
      .x-btn--primary { background: #C8341F; border-color: #C8341F; color: #fff; }
      .x-btn--primary:hover { background: #B02E1B; border-color: #B02E1B; }
      .x-btn--teal { background: var(--x-teal); border-color: var(--x-teal); color: #06201d; }
      .x-btn--lg { height: 46px; }
      .x-fine { font-size: 12px; color: var(--x-muted); }

      /* Shell */
      .x-app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
      .x-side { position: sticky; top: 0; height: 100vh; background: var(--x-panel); border-right: 1px solid var(--x-line); padding: 20px 12px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; z-index: 40; }
      .x-side__logo { height: 28px; width: auto; margin: 0 10px 6px; }
      .x-nav { display: grid; gap: 2px; }
      .x-nav a { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; color: var(--x-muted); text-decoration: none; font-weight: 600; }
      .x-nav a::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
      .x-nav a:hover { background: var(--x-panel-2); color: var(--x-text); }
      .x-nav a[aria-current] { background: #E8412C1f; color: var(--x-text); }
      .x-nav a[aria-current]::before { background: var(--x-red); opacity: 1; }
      .x-side__foot { margin-top: auto; padding: 12px; border: 1px solid var(--x-line); border-radius: var(--x-r); font-size: 12px; color: var(--x-muted); }
      .x-side__foot b { display: block; color: var(--x-text); font-size: 13px; }
      .x-main { min-width: 0; display: flex; flex-direction: column; }
      .x-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #0D1117e6; backdrop-filter: blur(12px); border-bottom: 1px solid var(--x-line); }
      .x-top .x-search { flex: 1; max-width: 420px; height: 40px; }
      .x-top select.x-input { width: auto; height: 40px; }
      .x-menu { display: none; width: 40px; padding: 0; }
      .x-spacer { flex: 1; }
      .x-bell { position: relative; width: 40px; padding: 0; }
      .x-bell span { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--x-red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; }
      .x-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--x-teal); color: #06201d; font-weight: 700; display: grid; place-items: center; flex: none; }
      .x-demo { padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid #E8412C66; color: #FF8A78; font-size: 12px; font-weight: 700; white-space: nowrap; }
      .x-who { font-size: 12px; color: var(--x-muted); font-weight: 600; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x-spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--x-line); border-top-color: var(--x-red); animation: x-spin 0.8s linear infinite; flex: none; }
      .x-loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 48px; color: var(--x-muted); }
      @keyframes x-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .x-spin { animation-duration: 2.4s; } }
      .x-toast.is-error { background: var(--x-red); color: #fff; }
      .x-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .x-row .x-btn { flex: 1; height: var(--tap); }
      .x-empty-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-style: dashed; }
      .x-card h2 .x-demo { margin-left: 8px; vertical-align: middle; font-family: var(--sans); }
      .x-view { padding: 24px; display: grid; gap: 20px; align-content: start; }
      .x-scrim { position: fixed; inset: 0; background: #0008; z-index: 35; }

      /* Content */
      .x-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .x-title h1 { font-size: 24px; }
      .x-title p { color: var(--x-muted); }
      .x-card { background: var(--x-panel); border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 18px; min-width: 0; }
      .x-card h2 { font-size: 15px; margin-bottom: 4px; }
      .x-card h2 + p { color: var(--x-muted); font-size: 12px; margin-bottom: 14px; }
      .x-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
      .x-kpi { display: grid; gap: 6px; }
      .x-kpi__label { color: var(--x-muted); font-size: 12px; font-weight: 600; }
      .x-kpi__fig { font: 600 26px/1.1 var(--x-head); }
      .x-up { color: var(--x-teal); font-size: 12px; font-weight: 700; }
      .x-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
      .x-list { list-style: none; margin: 0; padding: 0; }
      .x-list li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--x-line); }
      .x-list li:first-child { border-top: 0; }
      .x-list time { font: 600 13px var(--x-head); }
      .x-list small { display: block; color: var(--x-muted); }

      .x-tools { display: flex; gap: 10px; flex-wrap: wrap; }
      .x-tools .x-input { width: auto; height: 40px; }
      .x-tools .x-input[type="search"] { flex: 1; min-width: 180px; }
      .x-tablewrap { overflow-x: auto; padding: 0; }
      .x-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
      .x-table th, .x-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--x-line); }
      .x-table thead th { color: var(--x-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; background: var(--x-panel-2); }
      .x-table tbody tr:last-child td { border-bottom: 0; }
      .x-table tbody tr.x-click { cursor: pointer; }
      .x-table tbody tr.x-click:hover { background: var(--x-panel-2); }
      .x-table td small { display: block; color: var(--x-muted); font-size: 12px; }
      .x-table .x-num { font-variant-numeric: tabular-nums; }
      .x-empty { padding: 28px; text-align: center; color: var(--x-muted); }

      .x-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; border: 1px solid var(--x-line); color: var(--x-text); }
      .x-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--x-muted); }
      .x-pill--red { border-color: #E8412C66; color: #FF8A78; } .x-pill--red::before { background: var(--x-red); }
      .x-pill--teal { border-color: #12B5A666; color: #4FD6C9; } .x-pill--teal::before { background: var(--x-teal); }
      .x-pill--warm::before { background: #E8A92C; }
      .x-pill--dim { color: var(--x-muted); }
      .x-score { display: inline-grid; place-items: center; min-width: 40px; height: 26px; border-radius: 8px; font-weight: 700; font-size: 12px; background: var(--x-panel-2); border: 1px solid var(--x-line); }
      .x-score--hi { background: #12B5A626; border-color: #12B5A666; color: #4FD6C9; }
      .x-score--lo { background: #E8412C1f; border-color: #E8412C66; color: #FF8A78; }

      /* Customers timeline, settings tabs, toggles, matrix */
      .x-tl { list-style: none; margin: 0; padding: 0; }
      .x-tl li { position: relative; margin-left: 5px; padding: 0 0 16px 20px; border-left: 1px solid var(--x-line); }
      .x-tl li:last-child { border-left-color: transparent; padding-bottom: 0; }
      .x-tl li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--x-panel); border: 2px solid var(--x-muted); }
      .x-tl li:first-child::before { border-color: var(--x-red); background: var(--x-red); }
      .x-tl time { display: block; font-size: 12px; font-weight: 600; color: var(--x-muted); }
      .x-drawer h3 { font-size: 13px; color: var(--x-muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .x-chip[aria-selected="true"] { background: #E8412C1f; border-color: #E8412C66; color: var(--x-text); }
      .x-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
      .x-toggles { list-style: none; margin: 0; padding: 0; }
      .x-toggles li { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-top: 1px solid var(--x-line); }
      .x-toggles li:first-child { border-top: 0; }
      .x-toggles small { display: block; color: var(--x-muted); font-size: 12px; }
      .x-check { width: 20px; height: 20px; margin: 0; accent-color: var(--x-red); cursor: pointer; vertical-align: middle; }
      .x-table td.x-c, .x-table th.x-c { text-align: center; }

      /* Slim banner, chips, schedule, jobs, inspection, switch */
      .x-banner { position: relative; min-height: 120px; border-radius: var(--x-r); overflow: hidden; border: 1px solid var(--x-line); display: flex; }
      .x-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) saturate(0.85); }
      .x-banner > div { position: relative; flex: 1; display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px; background: linear-gradient(90deg, #0D1117cc, transparent 70%); }
      .x-banner h1 { font-size: 24px; }
      .x-banner p { color: #F4F1EAcc; }
      .x-chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-chip { height: 40px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--x-line); background: var(--x-panel); color: var(--x-muted); font-weight: 600; }
      .x-chip[aria-pressed="true"] { background: #E8412C1f; border-color: #E8412C66; color: var(--x-text); }
      .x-slots { list-style: none; margin: 0; padding: 0; }
      .x-slots > li { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--x-line); }
      .x-slots > li:first-child { border-top: 0; }
      .x-slots time { font: 600 13px var(--x-head); padding-top: 10px; }
      .x-slots .x-fine { padding-top: 10px; }
      .x-task { display: grid; grid-template-columns: 1fr 160px; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--x-panel-2); }
      .x-task + .x-task { margin-top: 6px; }
      .x-task small { display: block; color: var(--x-muted); }
      .x-task select { height: 40px; }
      .x-task select[data-s="On the way"] { border-color: #E8A92C99; }
      .x-task select[data-s="Done"] { border-color: #12B5A699; color: #4FD6C9; }
      .x-jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
      .x-job { display: grid; gap: 12px; align-content: start; }
      .x-job__head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
      .x-reg { font: 400 12px "Geist Mono", monospace; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--x-line); white-space: nowrap; }
      .x-job .x-dl { grid-template-columns: 80px 1fr; font-size: 13px; gap: 6px 10px; }
      .x-stage { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
      .x-stage span { height: 6px; border-radius: 3px; background: var(--x-line); }
      .x-stage span.on { background: var(--x-red); }
      .x-stage.is-done span { background: var(--x-teal); }
      .x-insp { display: grid; gap: 16px; }
      .x-insp__head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
      .x-insp__score { text-align: right; }
      .x-insp__score span { display: block; color: var(--x-muted); font-size: 12px; font-weight: 600; }
      .x-insp__score b { font: 600 40px/1 var(--x-head); color: #4FD6C9; }
      .x-mix { display: flex; width: 140px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--x-line); }
      .x-mix i:nth-child(1) { background: var(--x-teal); } .x-mix i:nth-child(2) { background: #E8A92C; } .x-mix i:nth-child(3) { background: var(--x-red); }
      .x-switch { position: relative; display: inline-block; width: 44px; height: 26px; vertical-align: middle; }
      .x-switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      .x-switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--x-line); pointer-events: none; transition: background var(--dur-quick) var(--ease-out); }
      .x-switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--x-muted); transition: transform var(--dur-quick) var(--ease-out); }
      .x-switch input:checked + span { background: var(--x-teal); }
      .x-switch input:checked + span::after { transform: translateX(18px); background: #fff; }
      .x-switch input:focus-visible + span { outline: 2px solid var(--x-red); }
      .x-table tr.is-off td:not(:last-child) { opacity: 0.45; }
      @media (max-width: 600px) { .x-task { grid-template-columns: 1fr; } }

      /* Parts orders, kanban, notes */
      .x-task select[data-s="Shipped"] { border-color: #E8A92C99; }
      .x-task select[data-s="Delivered"] { border-color: #12B5A699; color: #4FD6C9; }
      .x-stock { display: inline-flex; align-items: center; gap: 8px; }
      .x-kanban { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
      .x-col { background: var(--x-panel); border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 220px; }
      .x-col__head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 6px; }
      .x-col__head h2 { font-size: 13px; }
      .x-col__head span { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--x-panel-2); border: 1px solid var(--x-line); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
      .x-kcard { background: var(--x-panel-2); border: 1px solid var(--x-line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; cursor: pointer; }
      .x-kcard:hover { border-color: var(--x-muted); }
      .x-kcard__name { background: none; border: 0; padding: 0; text-align: left; font: 600 14px var(--x-head); color: var(--x-text); }
      textarea.x-input { height: auto; min-height: 110px; padding: 10px 12px; resize: vertical; line-height: 1.45; }

      /* Drawer, modal, toast */
      .x-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--x-panel); border-left: 1px solid var(--x-line); z-index: 60; padding: 22px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; box-shadow: -20px 0 60px #0008; }
      .x-drawer__head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
      .x-drawer__head h2 { font-size: 20px; }
      .x-close { width: 40px; height: 40px; padding: 0; flex: none; }
      .x-dl { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; margin: 0; }
      .x-dl dt { color: var(--x-muted); font-size: 12px; font-weight: 600; }
      .x-dl dd { margin: 0; }
      .x-overlay { position: fixed; inset: 0; background: #000a; z-index: 55; }
      .x-modal { position: fixed; z-index: 60; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
      .x-modal form { pointer-events: auto; width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--x-panel); border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .x-modal .x-full { grid-column: 1 / -1; }
      .x-modal__foot { display: flex; justify-content: end; gap: 10px; }
      .x-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70; padding: 12px 16px; border-radius: 12px; background: var(--x-teal); color: #06201d; font-weight: 700; box-shadow: var(--hark-shadow); }

      @media (max-width: 1000px) { .x-grid { grid-template-columns: 1fr; } }
      @media (max-width: 820px) {
        .x-app { grid-template-columns: 1fr; }
        .x-side { position: fixed; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: transform var(--dur-quick) var(--ease-out); }
        .x-app.is-open .x-side { transform: none; }
        .x-menu { display: inline-flex; }
        .x-top { padding: 10px 14px; flex-wrap: wrap; }
        .x-top .x-search { order: 9; flex-basis: 100%; max-width: none; }
        .x-view { padding: 16px 14px; }
        .x-modal form { grid-template-columns: 1fr; }
      }
      @media (max-width: 420px) { .x-who { display: none; } }
    </style>
  </head>
  <body>
    <div class="page" id="top">
      <!-- Login -->
      <section class="x-login" id="login" aria-label="Sign in">
        <img class="x-login__bg" src="team.jpg" alt="" />
        <form class="x-login__card" id="login-form">
          <img src="logo_dark.png" alt="Chekd Cars" />
          <h1>Checked. Trusted. Wow.</h1>
          <p>Sign in to the Chekd Cars admin console.</p>
          <label class="x-field">Email<input class="x-input" type="email" name="email" placeholder="you@chekdcars.in" autocomplete="username" /></label>
          <label class="x-field">Password<input class="x-input" type="password" name="password" placeholder="••••••••" autocomplete="current-password" /></label>
          <button class="x-btn x-btn--primary x-btn--lg" type="submit" id="login-go">Sign in</button>
          <div class="x-row">

        try { sessionStorage.setItem("chekd-rt", session.refresh_token); } catch (e) { /* private mode */ }
        clearTimeout(refreshTimer);
        const secs = Math.max(30, (+s.expires_in || 3600) - 60);
        refreshTimer = setTimeout(() => refreshSession().catch(() => { toast("Session expired. Sign in again.", true); signOut(true); }), secs * 1000);
      }
      async function refreshSession() {
        if (!session) throw new Error("Not signed in");
        const s = await sbFetch("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: session.refresh_token }, auth: false });
        setSession(s);

      }

        const r = await rest(TABLES[key], `?id=eq.${encodeURIComponent(row.id)}`, { method: "PATCH", body: patch, prefer: "return=representation" });
        Object.assign(row, (r && r[0]) || patch);

        } catch (e) { fails.push(`settings: ${e.message}`); }
        if (fails.length) toast(`Couldn't load ${fails.join(" · ")}`, true);

        layer.onclick = (e) => { if (e.target.closest("[data-close]")) closeLayer(); };

      function taskSummary() {
        if (!$("#d-sum")) return;
        const n = (s) => S.tasks.filter((t) => t.status === s).length;
        $("#d-sum").innerHTML = [["Today", S.tasks.length], ["On the way", n("On the way")], ["Done", n("Done")]]
          .map(([l, v]) => `<div class="x-card x-kpi"><span class="x-kpi__label">${l}</span><span class="x-kpi__fig">${v}</span></div>`).join("");
      }
      function taskRows() {
        if (!$("#d-slots")) return;
        taskSummary();
        const list = S.tasks.filter((t) => S.dType === "All" || t.type === S.dType).sort((a, b) => a.time.localeCompare(b.time));
        let html = "";
        for (let h = 9; h <= 19; h++) {
          const here = list.filter((t) => parseInt(t.time, 10) === h);
          html += `<li><time>${h}:00</time><div>${here.length ? here.map((t) => `
            <div class="x-task"><div><b>${t.time.replace(/^0/, "")} · ${esc(t.type)}</b> · ${esc(t.car)}<small>${esc(t.customer)}, ${esc(t.area)} · ${esc(t.captain)}</small></div>
            <select class="x-input" data-id="${esc(t.id)}" data-s="${esc(t.status)}" aria-label="Status for ${esc(t.customer)}">${opts(D_STATUS, t.status)}</select></div>`).join("")
            : `<p class="x-fine">Open</p>`}</div></li>`;
        }
        $("#d-slots").innerHTML = html;
      }
      function jobCards() {
        if (!$("#jobs")) return;
        const last = STAGES.length - 1;
        $("#jobs").innerHTML = S.jobs.map((j, i) => `

            <div><div class="x-job__head" style="margin-bottom:8px"><span class="x-fine">Stage ${j.stage + 1} of ${STAGES.length}</span>${pill(STAGES[j.stage])}</div>
              <div class="x-stage${j.stage === last ? " is-done" : ""}" role="progressbar" aria-valuemin="1" aria-valuemax="${STAGES.length}" aria-valuenow="${j.stage + 1}" aria-valuetext="${STAGES[j.stage]}">${STAGES.map((s, k) => `<span class="${k <= j.stage ? "on" : ""}" title="${s}"></span>`).join("")}</div></div>
            <button class="x-btn" data-adv="${i}"${j.stage === last ? " disabled" : ""}>${j.stage === last ? "Delivered ✓" : "Advance to " + STAGES[j.stage + 1]}</button>

      function staffRows() {
        if (!$("#staff-rows")) return;
        const rows = S.staff.map((s, i) => [s, i]).filter(([s]) => S.staffRole === "All" || s.role === S.staffRole);
        $("#staff-rows").innerHTML = rows.length ? rows.map(([s, i]) => `
          <tr class="${s.active ? "" : "is-off"}"><td><b>${esc(s.name)}</b></td><td>${esc(s.role)}</td><td>${esc(s.outlet)}</td><td class="x-num">${esc(s.phone)}</td>
          <td class="x-num">${esc(s.jobs)}</td><td class="x-num">${s.rating ? "★ " + (+s.rating).toFixed(1) : "—"}</td>
          <td><label class="x-switch"><input type="checkbox" data-i="${i}"${s.active ? " checked" : ""} aria-label="${esc(s.name)} active" /><span></span></label></td></tr>`).join("")
          : `<tr><td colspan="7" class="x-empty">No staff in this role.</td></tr>`;
      }
      function modal(label, fields, onSave) {
        layer.innerHTML = `<div class="x-overlay" data-close></div>
          <div class="x-modal" role="dialog" aria-modal="true" aria-label="${label}">
            <form><h2 class="x-full">${label}</h2>${fields}
              <div class="x-modal__foot x-full"><button type="button" class="x-btn" data-close>Cancel</button><button class="x-btn x-btn--primary">Save</button></div></form>
          </div>`;
        layer.onclick = (e) => { if (e.target.closest("[data-close]")) closeLayer(); };
        const f = $("form", layer);
        f.elements[0].focus();
        f.onsubmit = async (e) => {
          e.preventDefault();
          const b = $(".x-btn--primary", f); b.disabled = true;
          const ok = await onSave(f);
          if (ok === false) b.disabled = false; else closeLayer();
        };
      }

      /* ---------- Tables ---------- */
      function leadRows() {
        if (!$("#lead-rows")) return;
        const q = S.q.trim().toLowerCase();
        const rows = S.leads.filter((l) =>
          (S.status === "All" || l.status === S.status) &&
          (S.town === "All towns" || l.town === S.town) &&
          (!q || [l.name, l.car, l.area, l.town, l.captain, l.type, l.source].join(" ").toLowerCase().includes(q)));
        $("#lead-rows").innerHTML = rows.length ? rows.map((l) => `
          <tr class="x-click" data-id="${esc(l.id)}" tabindex="0">
            <td><b>${esc(l.name)}</b><small>${esc(l.area)}</small></td><td>${esc(l.type)}</td><td>${esc(l.car)}</td><td>${esc(l.source)}</td>
            <td>${esc(l.town)}</td><td>${pill(l.status)}</td><td>${esc(l.captain)}</td></tr>`).join("")
          : `<tr><td colspan="7" class="x-empty">No leads match these filters.</td></tr>`;
      }
      function carRows() {
        if (!$("#car-rows")) return;
        const q = S.q.trim().toLowerCase();
        const rows = S.cars.filter((c) => !q || [c.model, c.fuel, c.status].join(" ").toLowerCase().includes(q));
        $("#car-rows").innerHTML = rows.length ? rows.map((c) => `
          <tr><td><b>${esc(c.model)}</b></td><td class="x-num">${esc(c.year)}</td><td class="x-num">${(+c.km || 0).toLocaleString("en-IN")}</td><td>${esc(c.fuel)}</td>
          <td class="x-num"><b>₹${(+c.price || 0).toFixed(2)} L</b></td><td>${score(c.score)}</td><td>${pill(c.status)}</td></tr>`).join("")
          : `<tr><td colspan="7" class="x-empty">No cars match “${esc(S.q)}”.</td></tr>`;
      }

      /* ---------- Overlays ---------- */
      const layer = $("#layer");
      function closeLayer() { layer.innerHTML = ""; }
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeLayer(); setDrawer(false); } });

      function openLead(id) {
        const l = S.leads.find((x) => String(x.id) === String(id)); if (!l) return;
        layer.innerHTML = `<div class="x-overlay" data-close></div>
          <aside class="x-drawer" role="dialog" aria-modal="true" aria-label="Lead details">
            <div class="x-drawer__head"><div><h2>${esc(l.name)}</h2><p class="x-fine">${esc(l.type)} lead · ${esc(l.date)}</p></div><button class="x-btn x-close" data-close aria-label="Close">✕</button></div>
            <dl class="x-dl">
              <dt>Phone</dt><dd>${esc(l.phone)}</dd><dt>Car</dt><dd>${esc(l.car)}</dd><dt>Area</dt><dd>${esc(l.area)}, ${esc(l.town)}</dd>
              <dt>Source</dt><dd>${esc(l.source)}</dd><dt>Captain</dt><dd>${esc(l.captain)}</dd>
            </dl>
            <label class="x-field">Status<select class="x-input" id="lead-set">${LEAD_STATUS.map((s) => `<option${s === l.status ? " selected" : ""}>${s}</option>`).join("")}</select></label>
            <a class="x-btn x-btn--teal x-btn--lg" href="https://wa.me/919019088160" target="_blank" rel="noopener">Message on WhatsApp</a>
          </aside>`;
        layer.onclick = (e) => { if (e.target.closest("[data-close]")) closeLayer(); };
        $("#lead-set").onchange = (e) => {
          const sel = e.target; sel.disabled = true;
          upd("leads", l, { status: sel.value }).then((ok) => { sel.disabled = false; sel.value = l.status; leadRows(); if (ok) toast(`${l.name} moved to ${l.status}`); });
        };
        $(".x-close", layer).focus();
      }

      function openAddCar() {
        layer.innerHTML = `<div class="x-overlay" data-close></div>
          <div class="x-modal" role="dialog" aria-modal="true" aria-label="Add car">
            <form id="car-form">
              <h2 class="x-full">Add car</h2>
              <label class="x-field x-full">Make / model<input class="x-input" name="model" required placeholder="e.g. Hyundai Creta SX" /></label>
              <label class="x-field">Year<input class="x-input" name="year" type="number" min="2000" max="${new Date().getFullYear() + 1}" value="2021" required /></label>
              <label class="x-field">Km driven<input class="x-input" name="km" type="number" min="0" value="30000" required /></label>
              <label class="x-field">Fuel<select class="x-input" name="fuel"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option></select></label>
              <label class="x-field">Price (₹ lakh)<input class="x-input" name="price" type="number" step="0.01" min="0" value="8.5" required /></label>
              <label class="x-field">ChekdScore<input class="x-input" name="score" type="number" min="0" max="100" value="85" required /></label>
              <label class="x-field">Status<select class="x-input" name="status"><option>Inspection</option><option>Live</option><option>Reserved</option><option>Sold</option></select></label>
              <div class="x-modal__foot x-full"><button type="button" class="x-btn" data-close>Cancel</button><button class="x-btn x-btn--primary">Save car</button></div>
            </form>
          </div>`;
        layer.onclick = (e) => { if (e.target.closest("[data-close]")) closeLayer(); };
        const f = $("#car-form");
        f.model.focus();
        f.onsubmit = async (e) => {
          e.preventDefault();
          const b = $(".x-btn--primary", f); b.disabled = true;
          const row = { model: f.model.value.trim(), year: +f.year.value, km: +f.km.value, fuel: f.fuel.value, price: +f.price.value, score: Math.max(0, Math.min(100, +f.score.value)), status: f.status.value };
          if (await add("cars", row)) { render(); toast(`${row.model} added to inventory`); } else b.disabled = false;
        };
      }

      let toastTimer;
      function toast(msg, isError = false) {
        let t = $(".x-toast");
        if (!t) { t = document.createElement("div"); t.className = "x-toast"; document.body.appendChild(t); }
        t.setAttribute("role", isError ? "alert" : "status");
        t.classList.toggle("is-error", isError);
        t.textContent = msg; t.hidden = false;
        clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), isError ? 6000 : 2600);
      }

      /* ---------- Shell ---------- */
      $("#nav").innerHTML = NAV.map((n) => `<a href="#${n.toLowerCase()}">${n}</a>`).join("");
      function setDrawer(open) {
        $("#app").classList.toggle("is-open", open);
        $("#scrim").hidden = !open;
        $("#menu").setAttribute("aria-expanded", open);
      }
      $("#menu").onclick = () => setDrawer(true);
      $("#scrim").onclick = () => setDrawer(false);

      function render() {
        const key = location.hash.slice(1) || "dashboard";
        let name = NAV.find((n) => n.toLowerCase() === key) || "Dashboard";
        if (!allowed(name)) name = NAV.find(allowed) || "Dashboard";
        charts.forEach((c) => c.destroy()); charts = [];
        closeLayer(); setDrawer(false);
        document.querySelectorAll("#nav a").forEach((a) => a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + name.toLowerCase()));
        const el = $("#view");
        views[name.toLowerCase()](el);
        emptyCard(el, name.toLowerCase());
        document.title = `${name} · Chekd Cars Admin`;
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", render);

      $("#q").oninput = (e) => {
        S.q = e.target.value;
        const key = location.hash.slice(1);
        if (key === "leads") { $("#lead-q").value = S.q; leadRows(); }
        else if (key === "inventory") carRows();
        else if (key === "parts") { S.pq = S.q; $("#part-q").value = S.pq; partRows(); }
        else if (key === "customers") { $("#cust-q").value = S.q; custRows(); }
        else location.hash = "leads";
      };
      $("#town").onchange = (e) => { S.town = e.target.value; render(); toast(`Showing ${S.town}`); };

      /* ---------- Auth ---------- */
      const lf = $("#login-form");
      const loginMsg = (m) => { $("#login-msg").textContent = m; };
      async function loginBusy(btn, fn) {
        const btns = lf.querySelectorAll("button"), label = btn.textContent;
        btns.forEach((b) => (b.disabled = true));
        btn.innerHTML = `<span class="x-spin"></span>${esc(label)}`;
        try { await fn(); } catch (err) { loginMsg(err.message); toast(err.message, true); }
        finally { btns.forEach((b) => (b.disabled = false)); btn.textContent = label; }
      }
      const creds = () => {
        if (!lf.email.checkValidity() || !lf.email.value) { loginMsg("Enter a valid email address."); toast("Enter a valid email address.", true); lf.email.focus(); return null; }
        if (lf.password.value.length < 6) { loginMsg("Use a password of at least 6 characters."); toast("Use a password of at least 6 characters.", true); lf.password.focus(); return null; }
        return { email: lf.email.value.trim(), password: lf.password.value };
      };
      // Role comes from the profiles table, never from the browser. v1 'admin' rows count as Super Admin.
      async function loadRole() {
        let role = "Chekd Captain";
        try {
          const u = await sbFetch("/auth/v1/user");
          const r = (await rest("profiles", `?id=eq.${u.id}&select=role`)) || [];
          const v = r[0] && r[0].role;
          if (v === "admin") role = "Super Admin"; else if (v && S.perm[v]) role = v;
        } catch (e) { /* least privilege */ }
        return role;
      }
      const allowed = (name) => S.role === "Super Admin" || (S.perm[S.role] || []).includes(name);
      function drawNav() { $("#nav").innerHTML = NAV.filter(allowed).map((n) => `<a href="#${n.toLowerCase()}">${n}</a>`).join(""); }
      async function enterApp() {
        S.role = await loadRole();
        $("#who-role").textContent = S.role;
        const email = session.email || "";
        const base = (email.split("@")[0] || S.role).replace(/[^a-z ]/gi, " ").trim() || S.role;
        $("#avatar").textContent = base.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase() || "CA";
        $("#avatar").title = `${email} · ${S.role}`;
        $("#who-email").textContent = email;
        lf.password.value = ""; loginMsg("");
        $("#login").hidden = true;
        $("#app").hidden = false;
        await loadAll();
        drawNav();
        if (session) render();
      }
      lf.onsubmit = (e) => {
        e.preventDefault();
        const c = creds(); if (!c) return;
        loginBusy($("#login-go"), async () => {
          setSession(await sbFetch("/auth/v1/token?grant_type=password", { method: "POST", body: c, auth: false }));
          session.email = session.email || c.email;
          await enterApp();
        });
      };
      if ($("#login-signup")) $("#login-signup").onclick = (e) => {
        const c = creds(); if (!c) return;
        loginBusy(e.currentTarget, async () => {
          const r = await sbFetch(`/auth/v1/signup?redirect_to=${encodeURIComponent(location.href.split("#")[0])}`, { method: "POST", body: c, auth: false });
          if (r && r.access_token) { setSession(r); session.email = session.email || c.email; toast("Account created"); await enterApp(); }
          else loginMsg(`Account created. Check ${c.email} for a confirmation link, then sign in.`);
        });
      };
      $("#login-forgot").onclick = (e) => {
        if (!lf.email.value || !lf.email.checkValidity()) { loginMsg("Enter your email above first."); toast("Enter your email above first.", true); lf.email.focus(); return; }
        const email = lf.email.value.trim();
        loginBusy(e.currentTarget, async () => {
          await sbFetch(`/auth/v1/recover?redirect_to=${encodeURIComponent(location.href.split("#")[0])}`, { method: "POST", body: { email }, auth: false });
          loginMsg(`If ${email} has an account, a reset link is on its way.`);
        });
      };
      async function signOut(silent) {
        const s = session;
        session = null; clearTimeout(refreshTimer);
        try { sessionStorage.removeItem("chekd-rt"); } catch (e) { /* ignore */ }
        if (s && !silent) { try { await fetch(SB_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SB_KEY, Authorization: `Bearer ${s.access_token}` } }); } catch (e) { /* signed out locally anyway */ } }
        Object.keys(TABLES).forEach((k) => (S[k] = []));
        charts.forEach((c) => c.destroy()); charts = [];
        closeLayer(); $("#view").innerHTML = ""; $("#who-email").textContent = "";
        $("#app").hidden = true; $("#login").hidden = false;
        if (!silent) toast("Signed out");
      }
      $("#signout").onclick = () => signOut(false);

      // Links from confirmation and reset emails land with tokens in the hash
      (async () => {
        const h = new URLSearchParams(location.hash.slice(1));
        if (!h.get("access_token")) {
          if (h.get("error_description")) { loginMsg(h.get("error_description")); history.replaceState(null, "", location.pathname + location.search); return; }
          // Restore a session after a page refresh
          let rt = null; try { rt = sessionStorage.getItem("chekd-rt"); } catch (e) { /* ignore */ }
          if (rt) {
            try {
              setSession(await sbFetch("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: rt }, auth: false }));
              const u = await sbFetch("/auth/v1/user"); session.email = (u && u.email) || "";
              await enterApp();
            } catch (e) { session = null; try { sessionStorage.removeItem("chekd-rt"); } catch (x) { /* ignore */ } }
          }
          return;
        }
        const type = h.get("type");
        history.replaceState(null, "", location.pathname + location.search + "#dashboard");
        try {
          setSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") });
          const u = await sbFetch("/auth/v1/user");
          session.email = (u && u.email) || "";
          await enterApp();
          if (type === "recovery" && session) modal("Set a new password", `
            <label class="x-field x-full">New password<input class="x-input" name="password" type="password" minlength="6" required autocomplete="new-password" /></label>`, (f) =>
            busy(async () => { await sbFetch("/auth/v1/user", { method: "PUT", body: { password: f.password.value } }); toast("Password updated"); }));
        } catch (err) { session = null; loginMsg(err.message); }
      })();
    </script>
